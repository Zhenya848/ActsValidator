log_format no_query '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';

server {
    listen 80;

    location /api/Auth/ {
        proxy_pass http://userservice-api:8080;
    }

    location /api/Acts/ {
        proxy_pass http://actsservice-api:8080;
    }

    location /api/Payments/ {
        proxy_pass http://paymentservice-api:8080;
    }

    location /api/Chats/ {
        proxy_pass http://chatservice-api:8080;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/chat {
        access_log /var/log/nginx/hubs_access.log no_query;
        proxy_pass http://chatservice-api:8080;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}