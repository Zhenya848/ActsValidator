syntax = "proto3";

option csharp_namespace = "ChatService";

package greet;

service Greeter {
  rpc GetUsersByPermissions (GetUsersByPermissionsRequest) returns (GetUsersByPermissionsResponse);
}

message GetUsersByPermissionsRequest {
  repeated string permissions = 1;
}

message GetUsersByPermissionsResponse {
  repeated string userEmails = 1;
}